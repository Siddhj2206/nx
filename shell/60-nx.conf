# Puts the commands of nx's tool tier on the session's PATH (keybinds,
# launchers, user units), after the system's own directories, so the image
# and the host tier keep their names. Login shells get the same from
# /etc/profile.d/nx.sh. Installed as /usr/lib/environment.d/60-nx.conf.
PATH=${PATH}:/var/lib/nx/current/bin
