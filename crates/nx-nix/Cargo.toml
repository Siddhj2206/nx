[package]
name = "nx-nix"
description = "The tool tier: the nixpkgs catalog, store paths by evaluation, narinfo closures, realising through nix-daemon and its log"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
brotli-decompressor = "5.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
