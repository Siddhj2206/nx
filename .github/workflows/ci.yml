name: ci

on:
  push:
    branches: [main, "release/*"]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No debug info: smaller, faster builds and caches. Tests still backtrace.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The image's Fedora release, as dev/Containerfile: nx links its libsolv
    # and librpm. dev/run runs commands directly here (CI=true).
    container: quay.io/fedora/fedora:45
    steps:
      - run: >-
          dnf -y install --setopt=install_weak_deps=False
          rust cargo clippy rustfmt gcc libsolv-devel rpm-devel ShellCheck
          git-core gzip tar zstd
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # Pushes to main and release/* save; PRs only restore.
          save-if: ${{ github.event_name == 'push' }}
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise trust && mise run check
      # What a tag builds, on every push to a release branch: a release-only
      # failure shows up before the tag, and PRs skip the release build.
      - if: github.event_name == 'push'
        run: mise run dist
