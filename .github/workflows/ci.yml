name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The image's Fedora release, as dev/Containerfile: nx links its libsolv.
    container: quay.io/fedora/fedora:45
    steps:
      - run: >-
          dnf -y install --setopt=install_weak_deps=False
          rust cargo clippy rustfmt gcc libsolv-devel rpm-devel ShellCheck git-core
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: shellcheck spike/*.sh crates/nx-solv/generate.sh crates/nx-librpm/generate.sh dev/run dev/vm-install
