name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# As ci.yml, so the build restores main's cache.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # One tarball per Fedora release and architecture: nx links the image's
    # libsolv and librpm (design, M7 Packaging).
    container: quay.io/fedora/fedora:45
    steps:
      - run: >-
          dnf -y install --setopt=install_weak_deps=False
          rust cargo clippy rustfmt gcc libsolv-devel rpm-devel ShellCheck
          git-core gzip tar zstd
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise trust && mise run check
      - run: dev/dist "${GITHUB_REF_NAME}" dist
      - run: mv dist/SHA256SUMS "dist/SHA256SUMS.$(uname -m)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cat dist/SHA256SUMS.* | sort -k2 > dist/SHA256SUMS && rm dist/SHA256SUMS.*
      # The notes are the tag's section of CHANGELOG.md (dev/release wrote it).
      - name: Notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' \
            CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no ${GITHUB_REF_NAME#v} section"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
