# nx's tools and tasks: `mise run check` is the gate CI runs. Everything runs
# on the host, which needs libsolv-devel and rpm-devel (nx add them); CI's
# fedora container has them installed.

[tools]
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:koalaman/shellcheck" = "0.11.0"

[vars]
shell_scripts = "crates/nx-solv/generate.sh crates/nx-librpm/generate.sh dev/vm-install dev/dist dev/release tests/vm/*.sh tests/fixtures/*/record.sh"

[tasks.check]
description = "Every gate: fmt, clippy, tests, shellcheck"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
  "shellcheck {{vars.shell_scripts}}",
]

[tasks.dist]
description = "Build the release tarball for the workspace version into dist/"
run = 'dev/dist "v$(sed -n "s/^version = \"\(.*\)\"/\1/p" Cargo.toml)" dist'

[tasks.changelog]
description = "Show what the next release's changelog section would say"
run = "git-cliff --unreleased"

[tasks.release]
description = "Cut a release: mise run release 1.1.0 (bump, changelog, gates, commit, tag)"
run = "dev/release"

[tasks.vm]
description = "Build nx and install it into the Neptuno test VM"
run = "dev/vm-install"
