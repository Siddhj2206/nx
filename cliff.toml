# git-cliff: CHANGELOG.md from Conventional Commits (docs/development.md).
# Only what a user of nx notices goes in: features, fixes, performance and
# anything breaking. Docs, tests, CI, refactors and chores stay in git log.

[changelog]
header = """
# Changelog

What changed in each release of nx. Written by `dev/release` from the
commit history (git-cliff, `cliff.toml`); edit the commits, not this file.
"""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.message is matching("^nx") %}{{ commit.message }}{% else %}{{ commit.message | upper_first }}{% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = ".*", skip = true },
]
